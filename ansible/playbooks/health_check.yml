---
- name: Validate Sapphros lab nodes
  hosts: all
  gather_facts: true

  tasks:
    - name: Verify supported operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_major_version == "26"
        success_msg: "{{ inventory_hostname }} passed OS validation"
        fail_msg: "{{ inventory_hostname }} has an unexpected OS"

    - name: Create local report directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../reports/hosts"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Save host health report
      ansible.builtin.copy:
        content: |
          {
            "hostname": {{ ansible_hostname | to_json }},
            "distribution": {{ ansible_distribution | to_json }},
            "version": {{ ansible_distribution_version | to_json }},
            "kernel": {{ ansible_kernel | to_json }},
            "architecture": {{ ansible_architecture | to_json }},
            "processor_cores": {{ ansible_processor_cores | to_json }},
            "memory_mb": {{ ansible_memtotal_mb | to_json }},
            "root_free_mb": {{ (ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='size_available') | first // 1048576) | to_json }}
          }
        dest: "{{ playbook_dir }}/../../reports/hosts/{{ inventory_hostname }}.json"
        mode: "0644"
      delegate_to: localhost

    - name: Display validation result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is reachable and passed baseline validation"
