scenario_id: sapphros-detection-validation-v1
name: "Detection Validation v1 - Persistence, Credential Access, Defense Evasion"
description: >
  First closed-loop ATT&CK adversary emulation against win-target-01, driven by Caldera
  and validated against the Sapphros Attack Validation Lab Sysmon telemetry configuration.
date: 2026-09-19
target_host: win-target-01
caldera:
  server: http://192.168.1.19:8888
  adversary_id: 81b7a477-258a-4c9a-968c-227ebde7d692
  adversary_name: "Sapphros Detection Validation v1"
  operation_id: c30c6a6a-91c3-4c52-851d-4f33bd18fe24
  operation_name: sapphros-detection-validation-v1
  planner: atomic
  agent_paw: zfnbxi
techniques:
  - technique_id: T1547.001
    tactic: persistence
    ability_id: 5503b4931592d3d01840133599b87893
    ability_name: "Reg Key Run"
    executor: windows/cmd
    outcome: detected
    sigma_rule: detections/sigma/t1547_001_registry_run_key.yml
    evidence:
      sysmon_event_id: 13
      target_object: 'HKU\S-1-5-21-2620636624-428462497-3851630612-1001\Software\Microsoft\Windows\CurrentVersion\Run\Atomic Red Team'
      observed_time: "2026-09-19T04:30:39Z"

  - technique_id: T1003.001
    tactic: credential-access
    ability_id: 35d92515122effdd73801c6ac3021da7
    ability_name: "Dump LSASS.exe Memory using comsvcs.dll"
    executor: windows/psh
    outcome: prevented
    sigma_rule: detections/sigma/t1003_001_lsass_access_non_defender.yml
    evidence:
      defender_threat_name: "Trojan:Win32/RundllLolBin.AF"
      defender_threat_id: 2147793100
      defender_detection_time: "2026-09-19T04:31:20Z"
      note: >
        Microsoft Defender identified and remediated the encoded PowerShell/rundll32/comsvcs.dll
        command line before rundll32.exe produced a Sysmon ProcessCreate (Event ID 1) event, and
        before any dump file was written to disk. The only ProcessAccess (Event ID 10) events
        against lsass.exe observed in this window were generated by Defender's own engine
        (MsMpEng.exe) performing its detection/remediation scan, not by the simulated attacker
        technique. The original source-process-blind Sysmon detection rule would have produced a
        false positive attributing this event to attacker activity. The rule was tuned (see
        t1003_001_lsass_access_non_defender.yml) to exclude Defender's own process. This technique
        is recorded as PREVENTED by an existing control rather than DETECTED by the custom rule.

  - technique_id: T1070.004
    tactic: defense-evasion
    ability_id: 04858322bc6cd08282f2ce96cab5ee7c
    ability_name: "Delete a single file - Windows PowerShell"
    executor: windows/psh
    outcome: detected
    sigma_rule: detections/sigma/t1070_004_temp_file_deletion.yml
    evidence:
      sysmon_event_id: 26
      target_filename: 'C:\Users\sapphros-admin\AppData\Local\Temp\deleteme_T1551.004'
      observed_time: "2026-09-19T04:31:56Z"

incidental_findings:
  - description: >
      Sandcat's own execution mechanism (sandcat.exe injecting into powershell.exe to run agent
      commands) generated a Sysmon CreateRemoteThread (Event ID 8) event, incidentally producing
      telemetry resembling T1055 process injection, even though this was Caldera agent overhead
      rather than a planned technique in this scenario.
    sysmon_event_id: 8
    source_image: 'C:\Sapphros\Tools\sandcat.exe'
    target_image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    observed_time: "2026-09-19T04:31:20Z"
